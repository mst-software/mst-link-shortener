<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Forgot Password</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Enter your e-mail address below to reset your password.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="//fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic" rel="stylesheet">
    <link rel="stylesheet" href="assets/auth.css"/>
</head>
<body class="hold-transition login-page">

<div class="login-box">
    <div class="login-logo">
        <a href="index.html"><img src="assets/logo-poppins-dark.png" alt="LinkCash" /></a>
    </div>
    <!-- /.login-logo -->
    <div class="login-box-body">

        <div id="flash"></div>

    <form method="post" accept-charset="utf-8" id="forgotpassword-form" action="forgot-password.html" novalidate>
    <p>Enter your e-mail address below to reset your password.</p>

    <div class="form-group email required"><input type="email" name="email" placeholder="Email" class="form-control" required="required" maxlength="254" id="email" value=""/><span class="help-block"></span></div>

    <button class="btn btn-primary btn-block btn-flat btn-captcha" id="invisibleCaptchaForgotpassword" type="submit">Submit</button>    </form>

    </div>
    <!-- /.login-box-body -->
</div>
<!-- /.login-box -->

<footer>
    <div class="container text-center"></div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function () {
  /* ---- Thanh thông báo cookie ---- */
  var seen = false; try { seen = localStorage.getItem('lc_cookie') === '1'; } catch (e) {}
  if (!seen) {
    $('body').append('<div id="cookie-pop"><div class="container-fluid"><div class="col-xs-9"><div class="cookie-message">This website uses cookies to ensure you get the best experience on our website. <a href="privacy.html" target="_blank"><b>Learn more</b></a></div></div><div class="col-xs-3"><div class="cookie-confirm"><button id="got-cookie" class="btn btn-default" type="submit">Got it!</button></div></div></div></div>');
    $(document).on('click', '#got-cookie', function () {
      try { localStorage.setItem('lc_cookie', '1'); } catch (e) {}
      $('#cookie-pop').remove();
    });
  }

  /* ---- Kiểm tra form (demo, chưa nối backend) ---- */
  $('#forgotpassword-form').on('submit', function (e) {
    e.preventDefault();
    var $g = $('.form-group').removeClass('has-error'); $g.find('.help-block').text(''); $('#flash').empty();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($.trim($('#email').val()))) {
      $g.addClass('has-error').find('.help-block').text('The provided value is invalid'); return;
    }
    $('#flash').html('<div class="alert alert-success">Demo only: if this email exists, a reset link would be sent.</div>');
  });
});
</script>
</body>
</html>
